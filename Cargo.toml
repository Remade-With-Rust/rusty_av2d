[workspace]
members = [".", "tools"]
default-members = [".", "tools"]

[package]
name = "rusty_av2d"
authors = ["Mata Network <https://www.mata.network>", "Rav1d Developers", "Prossimo", "dav1d authors"]
version = "0.1.3"
edition = "2021"
rust-version = "1.79"
description = "Pure-Rust AV2 video decoder, no C/FFI. Byte-identical to the AVM reference decoder across a 45-clip conformance corpus."
license = "BSD-2-Clause"
repository = "https://github.com/Remade-With-Rust/rusty_av2d"
homepage = "https://github.com/Remade-With-Rust/rusty_av2d"
readme = "README.md"
keywords = ["av2", "video", "codec", "decoder", "avm"]
categories = ["multimedia::video", "multimedia"]
exclude = [
    "*.c", "*.h", "*.in", "meson*", "tests/", "doc/", "package/",
    "examples/", "retranspile.sh", "NEWS.dav1d",
]

[lib]
name = "rusty_av2d"
crate-type = ["staticlib", "rlib"]

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
cfg-if = "1.0.0"
libc = "0.2"
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
static_assertions = "1.1.0"
strum = { version = "0.27", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[build-dependencies]
cc = "1.0.79"
nasm-rs = { version = "0.3", features = ["parallel"] }

[features]
default = ["asm", "asm_arm64_dotprod", "asm_arm64_i8mm", "asm_arm64_sve2", "bitdepth_8", "bitdepth_16", "capi"]
# The C ABI (`dav1d_*` symbols, inherited from the dav1d lineage). ON by default
# so the CLI and C consumers work. Rust consumers that link another decoder of
# the same lineage (e.g. rav1d) MUST disable it -- the symbol names collide at
# link time. The safe Rust API is unaffected either way.
capi = []
asm = []
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
asm_arm64_sve2 = ["asm"]
bitdepth_8 = []
bitdepth_16 = []

[profile.dev]
panic = "abort"

[profile.opt-dev]
# The debug builds run tests very slowly so this profile keeps debug assertions
# while enabling basic optimizations. The profile is not suitable for debugging.
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
panic = "abort"
lto = "fat"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"

[profile.checked-release]
# Close to a release build, but with all checks enabled.
inherits = "dev"
opt-level = 2
codegen-units = 16
