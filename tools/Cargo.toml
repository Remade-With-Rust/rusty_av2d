[package]
name = "rusty_av2d-cli"
authors = ["Rav1d Developers", "Prossimo"]
version = "1.1.0"
edition = "2021"
default-run = "dav1d"
description = "CLI tools for the rusty_av2d pure-Rust AV2 decoder"
license = "BSD-2-Clause"
repository = "https://github.com/Remade-With-Rust/rusty_av2d"
publish = false
# `exclude` for C/meson artefacts dropped along with the inherited dav1d C tree.

[[bin]]
path = "dav1d.rs"
name = "dav1d"

[[bin]]
path = "seek_stress.rs"
name = "seek_stress"

[dependencies]
# The decoder is allocation-heavy (~190 sites, many per transform unit); on the
# system heap that dominates. Measured 1.38x on a 30-frame 640x360 clip.
rusty_alloc-api = "=1.1.6"
cfg-if = "1.0.0"
libc = "0.2"
rusty_av2d = { path = "../", version = "0.2.10", default-features = false, features = ["capi"] }

[build-dependencies]
cc = "1.0.79"

[features]
default = ["bitdepth_8", "bitdepth_16"]
bitdepth_8 = ["rusty_av2d/bitdepth_8"]
bitdepth_16 = ["rusty_av2d/bitdepth_16"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
] }
