# Generates include/rusty_av2d.h — the C declarations for the `capi` surface
# (the 20 `dav1d_*` symbols the staticlib exports).
#
#   cbindgen --lang c --crate rusty_av2d -o include/rusty_av2d.h
#
# The hand-maintained dav1d headers were deleted with the inherited C tree
# (they described AV1-era structs); this header is generated from the actual
# ABI so it cannot drift. Regenerate after any `#[no_mangle]` change.
language = "C"
include_guard = "RUSTY_AV2D_H"
autogen_warning = "/* Generated by cbindgen from the rusty_av2d capi surface — do not edit. */"
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true

[parse]
parse_deps = false

[export]
# The C ABI entry points are the `dav1d_*` no_mangle functions; cbindgen pulls
# in every type they reference. Internal Rust-only items that leak into the
# header are harmless noise, but exclude the obviously wrong ones here as they
# are found.
exclude = []

[fn]
sort_by = "None"

[struct]
derive_eq = false
